<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../plantillas/base.css"><link rel="stylesheet" href="../../plantillas/esteoeste.css">
<style>
.slide{background:var(--navy)}
.stars{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1.6px,transparent 1.8px),radial-gradient(rgba(255,156,143,.35) 1.4px,transparent 1.6px);background-size:90px 90px,140px 140px;background-position:0 0,40px 60px}
.kick{position:absolute;left:72px;top:150px;display:inline-flex;gap:12px;align-items:center;background:var(--coral);color:#fff;font-weight:700;font-size:28px;letter-spacing:3px;padding:12px 24px;border-radius:999px}
h1{position:absolute;left:72px;top:235px;width:900px;font-size:112px;color:#fff}
h1 em{font-style:normal;color:var(--coral)}
.msg{position:absolute;left:72px;width:520px;background:#fff;border-radius:30px;padding:22px 26px 22px 120px;box-shadow:0 22px 50px rgba(0,0,0,.35)}
.msg .l{position:absolute;left:24px;top:50%;transform:translateY(-50%);width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bricolage';font-weight:800;font-size:44px;color:#fff}
.msg b{display:block;font-size:24px;color:#7a7f96;font-weight:700;letter-spacing:1px}
.msg p{font-size:31px;line-height:1.25;color:var(--navy);margin-top:6px}
#ma{top:680px;transform:rotate(-2deg)} #mb{top:900px;transform:rotate(1.5deg)}
.msg p{font-size:33px}
.cutout{right:-10px;bottom:0;height:800px}
.screen{position:absolute;background:var(--navy);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.screen .n{width:38px;height:38px;border-radius:50%;background:var(--coral);color:#fff;font-family:'Bricolage';font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center}
.screen b{font-family:'Bricolage';font-weight:800;font-size:13px;color:#fff;line-height:1.1}
.foot{position:absolute;left:72px;bottom:66px;display:flex;align-items:center;gap:22px}
.foot .h{font-family:'Caveat';font-weight:700;font-size:50px;color:#FF9C8F;line-height:1;transform:rotate(-2deg)}
.foot .swipe{position:static}
.swipe.pill{background:var(--coral);color:#fff!important}
</style></head><body><div class="slide">
<div class="stars"></div>
<div class="logo" style="position:absolute;left:72px;top:64px;color:#fff">Yolos<span style="color:var(--coral)">Cuido</span></div>
<div class="count" style="color:#C3C7DD">1/4</div>
<div class="kick">24 DIC · 7:00 PM</div>
<h1 class="display">Dos familias<br>te escriben.<br><em>¿Con cuál vas?</em></h1>
<div class="msg" id="ma"><div class="l" style="background:#9A9DB2">A</div><b>FAMILIA A · AHORA</b><p>“¿Puedes venir hoy? Nomás un ratito…”</p></div>
<div class="msg" id="mb"><div class="l" style="background:var(--coral)">B</div><b>FAMILIA B · AHORA</b><p>“Hola, te escribo por YolosCuido para el 24…”</p></div>
<img class="cutout" id="m" src="../../modelo-recorte/13-mostrando-celular.png" alt="">
<div class="screen" id="s"><div class="n">2</div><b>mensajes<br>nuevos</b></div>
<div class="foot"><div class="swipe pill">Elige <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div><div class="h">antes de deslizar</div></div>
<script>
const m=document.getElementById('m'),s=document.getElementById('s');
function place(){const r=m.getBoundingClientRect(),k=r.height/873;
 s.style.left=(r.left+196*k)+'px'; s.style.top=(r.top+372*k)+'px'; s.style.width=(90*k)+'px'; s.style.height=(190*k)+'px'; s.style.borderRadius=(14*k)+'px';}
if(m.complete)place(); else m.onload=place;
</script>
</div></body></html>

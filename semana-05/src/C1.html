<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../plantillas/base.css"><link rel="stylesheet" href="../../plantillas/notas.css">
<style>
:root{--tomato:#E4412B}
.slide{background:var(--sun)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#F2B92E 2.5px, transparent 2.6px);background-size:36px 36px;opacity:.6}
h1{position:absolute;left:72px;top:140px;width:960px;font-size:116px;color:var(--ink)}
h1 em{font-style:normal;color:var(--tomato)}
.note{left:72px;top:500px;width:540px;height:690px;transform:rotate(-3deg)}
.note-title{font-size:54px}
.note-list li{font-size:33px}
.cutout{right:-330px;bottom:0;height:760px}
.sticker{left:520px;top:1010px;width:220px;height:220px;background:var(--tomato);color:#fff;font-size:46px;transform:rotate(10deg);padding:24px;box-shadow:0 14px 30px rgba(0,0,0,.2)}
</style></head><body><div class="slide">
<div class="dots"></div>
<div class="logo" style="position:absolute;left:72px;top:64px;color:var(--ink)">Yolos<span style="color:var(--tomato)">Cuido</span></div>
<div class="count" style="color:var(--ink)">1/4</div>
<h1 class="display">Lo que <em>nadie</em> te dice de diciembre</h1>
<img class="cutout" src="../../modelo-recorte/10-cafe-riendo.png" alt="">
<div class="note lines">
 <div class="note-bar"><span>‹ Notas</span><span>Listo</span></div>

 <div class="note-title">Diciembre, versión niñera</div>
 <ul class="note-list">

  <li><span class="n">2.</span>Las posadas acaban tarde. Tu horario también.</li>
 </ul>
 <div class="fade"></div>
</div>
<div class="sticker">La #5 casi nadie la ve venir</div>
</div></body></html>

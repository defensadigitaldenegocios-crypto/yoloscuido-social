<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../plantillas/base.css"><link rel="stylesheet" href="../../plantillas/cuenta.css">
<style>
.slide{background:radial-gradient(80% 60% at 80% 85%,#3A1F5C 0%,var(--night) 70%);color:var(--snow)}
h1{position:absolute;left:72px;top:240px;width:640px;font-size:100px;color:var(--snow)}
h1 em{font-style:normal;color:var(--gold)}
.chips{position:absolute;left:72px;top:600px;display:flex;gap:18px}
.chips div{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bricolage';font-weight:800;font-size:58px;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.25)}
.chips div:first-child{background:var(--gold);color:var(--night);border-color:var(--gold)}
.hint{position:absolute;left:76px;top:740px;width:560px;font-size:32px;line-height:1.3;color:#D6DBF2}
.hint b{color:#fff}
.btn{position:absolute;left:72px;top:900px;background:var(--pink);color:#fff;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.note{position:absolute;left:84px;top:1060px;font-size:46px;color:var(--gold);transform:rotate(-3deg);width:520px;line-height:1}
.cutout{right:-40px;bottom:0;height:900px}
.screen{position:absolute;background:var(--snow);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.screen .n{font-family:'Bricolage';font-weight:800;color:var(--pink);line-height:.9}
.screen i{font-style:normal;font-weight:700;color:var(--night);line-height:1.05}
</style></head><body><div class="slide">
<svg class="lights" viewBox="0 0 1080 150"><path d="M-10 30 Q 270 130 540 40 T 1090 40" fill="none" stroke="#0B1029" stroke-width="4"/><g id="bulbs"></g></svg>
<script>(function(){const g=document.getElementById("bulbs"),cols=["#FFC94D","#FF4FA3","#34C38F","#6FA8FF"];for(let i=0;i<14;i++){const t=i/13,x=-10+t*1100;let y;if(x<540){const u=(x+10)/550;y=(1-u)*(1-u)*30+2*(1-u)*u*130+u*u*40}else{const u=(x-540)/550;y=(1-u)*(1-u)*40+2*(1-u)*u*(-50)+u*u*40}const c=cols[i%4];g.innerHTML+=`<circle cx="${x}" cy="${y+22}" r="26" fill="${c}" opacity=".25"/><ellipse cx="${x}" cy="${y+22}" rx="11" ry="16" fill="${c}"/><rect x="${x-6}" y="${y+2}" width="12" height="8" rx="2" fill="#0B1029"/>`}})()</script>
<div class="logo" style="position:absolute;left:72px;top:150px;color:var(--snow)">Yolos<span style="color:var(--gold)">Cuido</span></div>
<div class="count" style="color:#AEB6DA;top:162px">4/4</div>
<h1 class="display">¿En qué semana <em>vas tú?</em></h1>
<div class="chips"><div>1</div><div>2</div><div>3</div><div>4</div></div>
<p class="hint"><b>Comenta tu número.</b> Si todavía no empiezas, comenta 0: hoy es buen día.</p>
<div class="btn">yoloscuido.com <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
<div class="note">guárdalo y mándaselo a tu amiga niñera</div>
<img class="cutout" id="m" src="../../modelo-recorte/13-mostrando-celular.png" alt="">
<div class="screen" id="s"><div class="n" id="n">32</div><i id="i">días</i></div>
<script>
const m=document.getElementById('m'),s=document.getElementById('s');
function place(){const r=m.getBoundingClientRect(),k=r.height/873;
 s.style.left=(r.left+196*k)+'px';s.style.top=(r.top+372*k)+'px';s.style.width=(90*k)+'px';s.style.height=(190*k)+'px';s.style.borderRadius=(14*k)+'px';
 document.getElementById('n').style.fontSize=(46*k)+'px';document.getElementById('i').style.fontSize=(15*k)+'px';}
if(m.complete)place();else m.onload=place;
</script>
</div></body></html>

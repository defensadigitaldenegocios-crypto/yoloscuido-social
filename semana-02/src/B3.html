<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../plantillas/base.css"><link rel="stylesheet" href="../../plantillas/notas.css">
<style>
.slide{background:var(--sun)}
.dots{position:absolute;inset:0;background-image:radial-gradient(#F2B92E 2.5px, transparent 2.6px);background-size:36px 36px;opacity:.6}
.note{left:72px;right:72px;top:150px;bottom:150px;transform:rotate(-1deg)}
.note-list{gap:54px;padding-top:44px}
.note-list li{font-size:52px}
.hl{background:linear-gradient(transparent 55%, #FFD24D 55%)}
.scribble{position:absolute;left:90px;bottom:62px;font-size:52px;color:var(--teal);transform:rotate(-3deg)}
</style></head><body><div class="slide">
<div class="dots"></div>
<div class="logo" style="position:absolute;left:72px;top:64px;color:var(--ink)">Yolos<span style="color:var(--teal)">Cuido</span></div>
<div class="count" style="color:var(--ink)">3/4</div>
<div class="note lines">
 <div class="note-bar"><span>‹ Notas</span><span>Listo</span></div>
 <div class="note-date">26 de octubre</div>
 <ul class="note-list">
  <li><span class="ck"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#13302C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span><span>Reconocer el berrinche que viene solo por el tono del primer “nooo”.</span></li>
  <li><span class="ck"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#13302C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span><span>Llegar a tu casa y seguir escuchando “¡mira, mira, mira!”.</span></li>
  <li><span class="ck"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#13302C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span><span>Que alguien te diga: <span class="hl"><b>“pero si solo los cuidas”.</b></span></span></li>
 </ul>
 <div style="margin:30px 40px 0;border-top:3px dashed #E6D8B5;padding-top:30px;display:flex;align-items:baseline;gap:20px"><span class="hand" style="font-size:72px;color:#C8901A">Total:</span><span style="font-family:Bricolage;font-weight:800;font-size:84px;color:#1d1b16">___ / 7</span></div>
</div>
<div class="scribble hand">pon tu total en comentarios ↓</div>
</div></body></html>

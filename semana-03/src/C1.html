<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../plantillas/base.css"><link rel="stylesheet" href="../../plantillas/checklist.css">
<style>
.slide{background:var(--kraft)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(120,90,50,.18) 2px, transparent 2.2px);background-size:30px 30px}
h1{position:absolute;left:72px;top:150px;width:940px;font-size:122px;color:var(--forest)}
h1 em{font-style:normal;color:var(--tomato)}
.sub{position:absolute;left:76px;top:430px;width:600px;font-size:36px;line-height:1.3;color:#5b4a33;font-weight:500}
.board{left:72px;top:600px;width:500px;height:700px;transform:rotate(-4deg)}
.paper{padding:52px 34px 24px}
.ptitle{font-size:38px}
.items{gap:26px;margin-top:26px}
.items li{gap:18px;align-items:center}
.box{width:46px;height:46px;border-radius:12px;border-width:4px}
.bar{height:22px;border-radius:11px;background:#E8DFCF;flex:1}
.hl5{background:var(--hl)}

.cutout{right:-30px;bottom:0;height:820px}
.screen{position:absolute;border-radius:16px;background:#FFFDF8;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:4px}
.screen .ck{width:40px;height:40px;border-radius:50%;background:var(--forest);display:flex;align-items:center;justify-content:center}
.screen b{font-family:'Bricolage';font-weight:800;font-size:16px;color:var(--forest);line-height:1.05}
.screen i{font-style:normal;font-size:10px;color:#8a7a62;font-weight:700;letter-spacing:1px}
.save{position:absolute;right:60px;top:430px;background:var(--forest);color:#fff;font-weight:700;font-size:28px;padding:14px 24px;border-radius:999px;transform:rotate(5deg);display:none}
</style></head><body><div class="slide">
<div class="dots"></div>
<div class="logo" style="position:absolute;left:72px;top:64px;color:var(--forest)">Yolos<span style="color:var(--tomato)">Cuido</span></div>

<h1 class="display">Tu kit de niñera <em>profesional</em></h1>

  <li><div class="box"></div><div class="bar"></div></li>

  <li><div class="box"></div><div class="bar" style="flex:.6"></div></li>

 </ul></div></div>
<div class="sticker">¿Ya tienes<br>la #5?</div>

<div class="screen" id="s"><div class="ck"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><b>Perfil<br>verificado</b><i>YOLOSCUIDO</i></div>
<script>
// coloca la pantalla sobre el celular de la modelo (pantalla en px de la imagen original 505x873: x196-286, y372-562)
const m=document.getElementById('m'),s=document.getElementById('s');
function place(){const k=m.getBoundingClientRect().height/873, r=m.getBoundingClientRect();
 s.style.left=(r.left+196*k)+'px'; s.style.top=(r.top+372*k)+'px'; s.style.width=(90*k)+'px'; s.style.height=(190*k)+'px'; s.style.borderRadius=(14*k)+'px';}
if(m.complete)place(); else m.onload=place;
</script>
</div></body></html>

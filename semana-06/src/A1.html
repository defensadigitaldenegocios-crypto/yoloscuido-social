<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../plantillas/base.css"><link rel="stylesheet" href="../../plantillas/quiz.css">
<style>
.slide{background:var(--wine)}
.blob{position:absolute;right:-180px;bottom:-140px;width:860px;height:860px;border-radius:50%;background:var(--wine-2)}
h1{position:absolute;left:72px;top:250px;width:960px;font-size:132px;color:var(--paper)}
h1 em{font-style:normal;color:var(--bub)}
.cards{position:absolute;left:72px;top:690px;display:flex;flex-direction:column;gap:26px}
.card{width:430px;height:132px;background:var(--paper);border-radius:30px;display:flex;align-items:center;gap:24px;padding:0 26px;box-shadow:0 16px 34px rgba(0,0,0,.3)}
.card:nth-child(1){transform:rotate(-3deg)} .card:nth-child(2){transform:rotate(2deg);margin-left:34px} .card:nth-child(3){transform:rotate(-1.5deg)}
.card .letter{width:84px;height:84px;font-size:48px}
.card .lc{background:var(--wine);color:var(--paper)}
.card .hid{flex:1}
.card .hid b{display:block;font-family:'Bricolage';font-weight:800;font-size:25px;color:var(--wine);letter-spacing:.5px;white-space:nowrap}
.card .hid i{display:block;height:18px;border-radius:9px;background:repeating-linear-gradient(90deg,#E9C9D4 0 26px,#F3DCE3 26px 40px);margin-top:12px;filter:blur(1.5px)}
.note{position:absolute;left:96px;top:1170px;font-family:'Caveat';font-weight:700;font-size:52px;color:var(--lemon);transform:rotate(-3deg)}
.cutout{right:-40px;bottom:0;height:800px}
</style></head><body><div class="slide">
<div class="stars"></div><div class="blob"></div>
<div class="logo" style="position:absolute;left:72px;top:64px;color:var(--paper)">Yolos<span style="color:var(--bub)">Cuido</span></div>
<div class="count" style="color:var(--bub-2)">1/4</div>
<div class="tagq" style="left:72px;top:150px;background:var(--lemon);color:var(--wine)">TEST · 3 PREGUNTAS · 30 SEG</div>
<h1 class="display">¿Qué niñera de <em>diciembre</em> eres?</h1>
<div class="cards">
 <div class="card"><div class="letter la">A</div><div class="hid"><b>RESULTADO OCULTO</b><i style="width:88%"></i></div></div>
 <div class="card"><div class="letter lb">B</div><div class="hid"><b>RESULTADO OCULTO</b><i style="width:70%"></i></div></div>
 <div class="card"><div class="letter lc">C</div><div class="hid"><b>RESULTADO OCULTO</b><i style="width:80%"></i></div></div>
</div>
<div class="note">Anota tus letras y desliza →</div>
<img class="cutout" src="../../modelo-recorte/11-senalando.png" alt="">
</div></body></html>

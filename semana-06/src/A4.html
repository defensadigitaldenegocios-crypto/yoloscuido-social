<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../plantillas/base.css"><link rel="stylesheet" href="../../plantillas/quiz.css">
<style>
.slide{background:var(--bub)}
.ring{position:absolute;right:-230px;bottom:-230px;width:900px;height:900px;border-radius:50%;background:var(--bub-2)}
h2{position:absolute;left:72px;top:160px;width:940px;font-size:124px;color:var(--wine)}
h2 em{font-style:normal;color:var(--paper);-webkit-text-stroke:0}
.abc{position:absolute;left:72px;top:470px;display:flex;gap:18px}
.abc .letter{width:118px;height:118px;font-size:64px;box-shadow:0 14px 30px rgba(74,14,43,.25)}
.abc .la{background:var(--wine);color:var(--bub)} .abc .lc{background:var(--paper)}
.steps{position:absolute;left:72px;top:660px;display:flex;flex-direction:column;gap:16px}
.steps div{display:flex;align-items:center;gap:18px;font-size:34px;font-weight:700;color:var(--wine)}
.steps i{font-style:normal;flex:none;width:54px;height:54px;border-radius:50%;background:var(--wine);color:var(--bub);display:flex;align-items:center;justify-content:center;font-family:'Bricolage';font-weight:800;font-size:28px}
.cta{position:absolute;left:72px;top:905px;background:var(--wine);color:var(--paper)}
.stk{position:absolute;left:72px;bottom:80px;width:470px;background:var(--lemon);border-radius:28px;padding:24px 30px;transform:rotate(-2.5deg);box-shadow:0 18px 40px rgba(74,14,43,.2)}
.stk .h{font-family:'Caveat';font-weight:700;font-size:46px;color:var(--wine);line-height:1}
.stk small{display:block;font-size:23px;color:var(--wine);margin-top:10px;font-weight:500;opacity:.8}
.cutout{right:30px;bottom:0;height:1000px}
</style></head><body><div class="slide">
<div class="ring"></div>
<div class="logo" style="position:absolute;left:72px;top:64px;color:var(--wine)">Yolos<span style="color:var(--paper)">Cuido</span></div>
<div class="count" style="color:var(--wine)">4/4</div>
<h2 class="display">Comenta tu <em>letra.</em></h2>
<div class="abc"><div class="letter la">A</div><div class="letter lb">B</div><div class="letter lc">C</div></div>
<div class="steps"><div><i>1</i>Regístrate</div><div><i>2</i>Verifica tu perfil</div><div><i>3</i>Define qué ofreces</div></div>
<div class="btn cta">yoloscuido.com <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
<div class="stk"><div class="h">Mándaselo a tu amiga niñera y comparen letras</div><small>Link en bio · Antes de que abran las reservas</small></div>
<img class="cutout" src="../../modelo-recorte/05-caminando-bolsa.png" alt="">
</div></body></html>
